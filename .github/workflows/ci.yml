name: CI

on:
  push:
    branches: [main, refactor/mece-security-seo]
  pull_request:
    branches: [main, refactor/mece-security-seo]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/cache@v4
        with:
          path: |
            .next/cache
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-frontend-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      - run: npm ci

      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: npm run test:unit:coverage
      - run: npm run build

      - run: npx playwright install chromium --with-deps

      - run: npm run test:e2e
        env:
          CI: true
          PLAYWRIGHT_PREBUILT: true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-output
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: my-worker/package-lock.json

      - run: npm ci
      - run: npx vitest run
